[project]
name = "claude-agent-reliability-kit"
version = "0.1.0"
description = "Production hardening for Claude tool-use agents: loop guards, schema-validated output, backoff, durable queue, prompt caching, structured logs."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
